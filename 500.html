<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Wahaj Amin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .error-container {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            color: #ff014f;
            text-shadow: 0 0 10px rgba(255, 1, 79, 0.5);
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .error-icon {
            font-size: 120px;
            color: #ff014f;
            margin-bottom: 30px;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0e0e0e;
        }

        .error-description {
            font-size: 18px;
            color: #0e0e0e;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .btn-home {
            background: #ff014f;
            color: #ffffff;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 1, 79, 0.4);
            margin: 0 10px 10px 10px;
        }

        .btn-home:hover {
            background: #e6004a;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 1, 79, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #ff014f;
            border: 2px solid #ff014f;
        }

        .btn-secondary:hover {
            background: #ff014f;
            color: #ffffff;
        }

        .btn-home i {
            margin-right: 8px;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.05;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: #ff014f;
            animation: rise 10s infinite ease-in;
            opacity: 0.2;
        }

        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            left: 30%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 100px;
            height: 100px;
            left: 50%;
            animation-duration: 12s;
            animation-delay: 1s;
        }

        .circle:nth-child(4) {
            width: 90px;
            height: 90px;
            left: 70%;
            animation-duration: 9s;
            animation-delay: 3s;
        }

        .circle:nth-child(5) {
            width: 110px;
            height: 110px;
            left: 85%;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        @keyframes rise {
            0% {
                bottom: -150px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px);
            }
            100% {
                bottom: 100%;
                transform: translateX(-100px);
            }
        }

        .status-info {
            text-align: start;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 1, 79, 0.1);
            border-radius: 10px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 1, 79, 0.2);
        }

        .status-info p {
            margin: 10px 0;
            font-size: 14px;
            color: #0e0e0e;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 120px;
            }

            .error-title {
                font-size: 32px;
            }

            .error-description {
                font-size: 16px;
            }

            .error-icon {
                font-size: 80px;
            }
        }
    </style>
</head>
<body style="background-image: url(assets/img/shape/banner-1.jpg);">
<div class="background-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-cog"></i>
    </div>
    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-description">
        Something went wrong on our end. Our team has been notified and we're working to fix it.
        Please try again in a few moments.
    </p>

    <div>
        <a href="index.html" class="btn-home">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>

    <div class="status-info">
        <p><strong>What you can do:</strong></p>
        <p><i class="fas fa-check-circle" style="color: #ff014f;"></i> Refresh the page</p>
        <p><i class="fas fa-check-circle" style="color: #ff014f;"></i> Clear your browser cache</p>
        <p><i class="fas fa-check-circle" style="color: #ff014f;"></i> Try again in a few minutes</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
